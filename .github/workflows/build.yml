name: Build HypicVIP Dylib
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download fishhook
        run: |
          curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o fishhook.c
          curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o fishhook.h
      - name: Build
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -mios-version-min=14.0 \
            -framework Foundation \
            -o HypicVIP.dylib \
            hypic_vip.m fishhook.c \
            -Xlinker -dead_strip
      - uses: actions/upload-artifact@v4
        with:
          name: HypicVIP-dylib
          path: HypicVIP.dylib
